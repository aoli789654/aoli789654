<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0D1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #C8A2C8;
            overflow: hidden;
            position: relative;
        }
        .title {
            font-size: 52px;
            font-weight: 800;
            color: #E6E6FA;
            text-shadow: 0 0 10px #8A2BE2, 0 0 20px #8A2BE2;
            animation: pulse-glow 3s infinite alternate;
            margin-bottom: 8px;
            letter-spacing: 4px;
            z-index: 10;
        }
        .subtitle {
            font-size: 16px;
            letter-spacing: 3px;
            color: #C8A2C8;
            font-weight: 300;
            z-index: 10;
        }
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px #8A2BE2, 0 0 20px #8A2BE2; transform: scale(1); }
            100% { text-shadow: 0 0 15px #8A2BE2, 0 0 35px #8A2BE2, 0 0 50px #8A2BE2; transform: scale(1.02); }
        }
        .circle {
            position: absolute;
            background-color: transparent;
            border: 2px solid rgba(200, 162, 200, 0.4);
            border-radius: 50%;
            animation: float 5s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
        }
        .ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 600px;
            height: 600px;
            margin-left: -300px;
            margin-top: -300px;
            border: 1px dashed rgba(138, 43, 226, 0.2);
            border-radius: 50%;
            animation: spin 30s linear infinite;
        }
        .ring2 {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 500px;
            height: 500px;
            margin-left: -250px;
            margin-top: -250px;
            border: 1px dotted rgba(200, 162, 200, 0.3);
            border-radius: 50%;
            animation: spin 20s linear infinite reverse;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
      </style>
      <div class="container">
        <!-- Magic Arrays Background -->
        <div class="ring"></div>
        <div class="ring2"></div>
        
        <!-- Decoration bubbles -->
        <div class="circle" style="left: 15%; top: 80%; width: 10px; height: 10px; animation-delay: 0s; animation-duration: 4s;"></div>
        <div class="circle" style="left: 35%; top: 90%; width: 18px; height: 18px; animation-delay: 1.2s; animation-duration: 5s;"></div>
        <div class="circle" style="left: 65%; top: 75%; width: 14px; height: 14px; animation-delay: 0.5s; animation-duration: 4.5s;"></div>
        <div class="circle" style="left: 85%; top: 85%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 6s;"></div>
        
        <div class="title">『 梦 华 璃 月 』</div>
        <div class="subtitle">&lt; Full-Stack Tech Magician @aoli789654 /&gt;</div>
      </div>
    </div>
  </foreignObject>
</svg>
