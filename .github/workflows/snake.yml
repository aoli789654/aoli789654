name: Generate Dimensional Serpent (Snake)

on:
  # 每 24 小时运行一次
  schedule:
    - cron: "0 0 * * *"
  
  # 允许在 Actions 标签页手动运行
  workflow_dispatch:
  
  # 每次推送到主分支时运行
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 生成蛇的 SVG 动画，配置魔法次元主题颜色
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8A2BE2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8A2BE2&color_dots=#0D1117,#161B22,#C8A2C8,#8A2BE2,#4B0082
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # 将生成的 SVG 文件推送到名为 "output" 的孤立分支，保持 main 分支干净
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
