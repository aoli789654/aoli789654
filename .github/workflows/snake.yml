name: Generate Dimensional Serpent & Stats Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8A2BE2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8A2BE2&color_dots=#0D1117,#161B22,#C8A2C8,#8A2BE2,#4B0082
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download Remote Stats to Local SVGs
        run: |
          mkdir -p dist
          # Download remote SVG cards and save them as static files in the output branch.
          curl -H "Cache-Control: no-cache" "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&title_color=8A2BE2&icon_color=8A2BE2&text_color=C8A2C8&bg_color=0D1117&hide_border=true&rank_icon=github" > dist/github-stats.svg
          curl -H "Cache-Control: no-cache" "https://github-readme-streak-stats.herokuapp.com/?user=${{ github.repository_owner }}&theme=dark&background=0D1117&ring=8A2BE2&fire=8A2BE2&currStreakNum=C8A2C8&sideNums=C8A2C8&currStreakLabel=C8A2C8&sideLabels=C8A2C8&dates=C8A2C8&hide_border=true" > dist/github-streak.svg
          curl -H "Cache-Control: no-cache" "https://github-readme-stats.vercel.app/api/pin/?username=${{ github.repository_owner }}&repo=bilibili-danmaku-analysis&title_color=8A2BE2&icon_color=8A2BE2&text_color=C8A2C8&bg_color=161B22&hide_border=true" > dist/artifact-1.svg
          curl -H "Cache-Control: no-cache" "https://github-readme-stats.vercel.app/api/pin/?username=${{ github.repository_owner }}&repo=TimeArtifacts&title_color=8A2BE2&icon_color=8A2BE2&text_color=C8A2C8&bg_color=161B22&hide_border=true" > dist/artifact-2.svg

      - name: push raw SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
